name: TikTok vers YouTube

on:
  schedule:
    - cron: "*/15 * * * *"   # secours (GitHub le lance rarement) ; le vrai rythme vient de cron-job.org
  workflow_dispatch:          # lancé par cron-job.org ou le bouton "Run workflow"

permissions:
  contents: write

concurrency:
  group: repost
  cancel-in-progress: false

jobs:
  repost:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer
        run: |
          pip install -q -r requirements.txt
          pip install -q -U "yt-dlp[default,curl-cffi]"
          sudo apt-get install -y -qq ffmpeg

      - name: Reposter les nouveaux TikTok (tous les comptes de comptes.json)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_HISTOIRE: ${{ secrets.YT_REFRESH_TOKEN_HISTOIRE }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
        run: python repost.py

      - name: Mémoriser les vidéos traitées
        if: always()
        run: |
          git config user.name "repost-bot"
          git config user.email "repost-bot@users.noreply.github.com"
          git add seen*.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Vidéos traitées" && git push)
